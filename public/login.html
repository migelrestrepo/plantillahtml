<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Kōhi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #0a0a0a;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 450px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      color: #d4a574;
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
      text-align: center;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #9a9a9a;
      margin-bottom: 2rem;
      text-align: center;
      font-weight: 300;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: #b8b8b8;
      margin-bottom: 0.5rem;
      font-weight: 400;
    }

    input {
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 2px;
      color: #e8e8e8;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #d4a574;
      background-color: #222;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      background-color: #d4a574;
      color: #0a0a0a;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .btn:hover:not(:disabled) {
      background-color: #e8ba8a;
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 2px;
      font-size: 0.95rem;
      text-align: center;
    }

    .message.success {
      background-color: rgba(212, 165, 116, 0.15);
      border: 1px solid #d4a574;
      color: #d4a574;
    }

    .message.error {
      background-color: rgba(220, 100, 100, 0.15);
      border: 1px solid #dc6464;
      color: #dc6464;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #9a9a9a;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: #d4a574;
    }

    .register-link {
      text-align: center;
      margin-top: 2rem;
      color: #9a9a9a;
      font-size: 0.9rem;
    }

    .register-link a {
      color: #d4a574;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .register-link a:hover {
      color: #e8ba8a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kōhi</h1>
    <p class="subtitle">Accede a tu cuenta</p>

    <div id="message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="btn" id="submitBtn">Iniciar sesión</button>
    </form>

    <div class="register-link">
      ¿No tienes cuenta? <a href="/register.html">Regístrate aquí</a>
    </div>

    <a href="/" class="back-link">← Volver al inicio</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type) {
      messageDiv.className = `message ${type}`;
      messageDiv.textContent = text;
    }

    function clearMessage() {
      messageDiv.className = '';
      messageDiv.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Iniciando sesión...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Error al iniciar sesión');
        }

        localStorage.setItem('token', data.token);

        showMessage('Inicio de sesión exitoso. Redirigiendo...', 'success');

        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1000);

      } catch (error) {
        showMessage(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar sesión';
      }
    });
  </script>
</body>
</html>
