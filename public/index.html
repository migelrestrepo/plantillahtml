<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kōhi - Café de Especialidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #0a0a0a;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 5rem;
      font-weight: 300;
      color: #d4a574;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
    }

    .subtitle {
      font-size: 1.25rem;
      color: #b8b8b8;
      margin-bottom: 2.5rem;
      font-weight: 300;
    }

    .philosophy {
      font-size: 1rem;
      color: #9a9a9a;
      margin-bottom: 3rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      font-weight: 300;
      line-height: 1.8;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      text-decoration: none;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-primary {
      background-color: #d4a574;
      color: #0a0a0a;
    }

    .btn-primary:hover {
      background-color: #e8ba8a;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: transparent;
      color: #d4a574;
      border: 1px solid #d4a574;
    }

    .btn-secondary:hover {
      background-color: rgba(212, 165, 116, 0.1);
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 3.5rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kōhi</h1>
    <p class="subtitle">Café de especialidad. Próxima apertura.</p>
    <p class="philosophy">
      Cada taza cuenta una historia. Seleccionamos granos de origen único,
      tostados con precisión, para ofrecer una experiencia sensorial auténtica.
    </p>
    <div class="button-group">
      <a href="/register.html" class="btn btn-primary">Unirme a la lista</a>
      <a href="/login.html" class="btn btn-secondary">Ya tengo cuenta</a>
    </div>
  </div>
</body>
</html>
